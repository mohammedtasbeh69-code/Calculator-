<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanin Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap');
body{font-family:'Cairo',sans-serif;background:#0a192f;color:white;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#112240;border:2px solid #d4af37;border-radius:20px;padding:30px;width:90%;max-width:400px;text-align:center}
h1{color:#d4af37;font-size:32px;margin:0}
p{color:#8892b0}
.tasbeh{font-size:50px;background:#0a192f;width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:20px auto;border:3px solid #d4af37}
#count{font-size:48px;color:#d4af37;font-weight:bold}
button{background:#d4af37;color:#0a192f;border:none;padding:12px 25px;border-radius:30px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>HANIN PRO</h1>
<p style="color:white">بواسطة حنين - 14 سنة - من مصر</p>
<p>مشروعي لمنحة كوريا GKS</p>
<div class="tasbeh">📿</div>
<div id="count">0</div>
<br>
<button onclick="c++;document.getElementById('count').innerText=c">سبحي</button>
</div>
<script>let c=0;</script>
</body>
</html>
